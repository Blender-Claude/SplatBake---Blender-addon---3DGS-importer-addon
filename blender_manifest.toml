schema_version = "1.0.0"

id = "splatbake"
version = "1.16.1"
name = "Splatbake (WIP)"
tagline = "Import a Gaussian splat, bake it to real geometry, render it"
maintainer = "MMJ"
type = "add-on"

tags = ["3D View", "Import-Export", "Render"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

copyright = [
  "2026 MMJ",
]

# Only the permissions actually used are declared. Note that Ctrl+C / Ctrl+V
# copy models through an internal Python list, NOT the system clipboard, so
# no "clipboard" permission is needed.
[permissions]
files = "Import Gaussian splat .ply, .splat and .sog files from disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/tests/",
  "*.pyc",
  # Screenshots are for the repo's README on the web, not for the installed
  # add-on - no need to put 1.6 MB of PNG in everyone's add-ons folder.
  "/docs/",
  # Issue templates belong to the repository, not to the shipped add-on.
  "/.github/",
]
